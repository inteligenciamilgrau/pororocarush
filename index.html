<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pororoca Rush</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="apple-touch-icon" href="./favicon.svg" />
<meta name="theme-color" content="#e07a16" />
<meta name="description" content="Surfe a pororoca do Arari — tubos, manobras e troncos no rio amazônico ao pôr do sol." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800;1,900&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/hud/hud.css" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0704; overflow: hidden; }
  body { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }
  #gl { display: block; width: 100%; height: 100%; }
  #hud-root { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

  #boot {
    position: absolute; inset: 0; z-index: 100; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 62%, #6b3a12 0%, #23150a 55%, #0a0704 100%);
    transition: opacity .7s ease; color: #f4e3c4;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .inner { text-align: center; }
  #boot h1 {
    font-family: 'Archivo Black', sans-serif; font-size: 4.2rem; margin: 0; letter-spacing: .01em;
    background: linear-gradient(180deg,#fff 40%,#ffb64a 60%,#ff7a18 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 8px 40px rgba(255,120,20,.35);
  }
  #boot p { font-size: 1.05rem; letter-spacing: .32em; text-transform: uppercase; opacity: .75; margin: .6rem 0 2rem; }
  #bar { width: min(420px, 60vw); height: 3px; background: rgba(255,255,255,.14); border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#ffd24a,#ff7a18); transition: width .25s ease; }
  #boot small { display: block; margin-top: .9rem; opacity: .55; letter-spacing: .18em; text-transform: uppercase; font-size: .74rem; }
  #fatal { position:absolute; inset:0; z-index:200; display:none; padding:4vh 5vw; overflow:auto;
           background:#140a06; color:#ffb3a0; font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>
    <div id="hud-root"></div>
    <div id="boot">
      <div class="inner">
        <h1>POROROCA RUSH</h1>
        <p>Pororoca do Arari</p>
        <div id="bar"><i></i></div>
        <small id="boot-msg">carregando…</small>
      </div>
    </div>
    <pre id="fatal"></pre>
  </div>

<script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('fatal');
    el.style.display = 'block';
    el.textContent += `\n[error] ${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n${e.error && e.error.stack || ''}\n`;
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('fatal');
    el.style.display = 'block';
    el.textContent += `\n[unhandled] ${e.reason && (e.reason.stack || e.reason.message || e.reason)}\n`;
  });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
