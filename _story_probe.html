<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800;1,900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0704}
  /* stand-in for the game frame behind the modal */
  #bg{position:fixed;inset:0;background:
    radial-gradient(ellipse at 62% 58%, #ffb64a 0%, #c46a18 22%, #6b3a12 52%, #23150a 78%, #0a0704 100%);}
  #bg::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 3px, transparent 3px 9px);}
</style>
</head>
<body>
<div id="bg"></div>
<script type="module">
  import { StoryScreen } from './src/hud/story.js';
  const s = new StoryScreen({ onClose: () => { window.__closed = true; } });
  window.__story = s;
  await document.fonts.ready;
  s.show();
  window.__ready = true;
</script>
</body>
</html>
